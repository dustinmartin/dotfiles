onboarding = false
[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
status_indicators = "dots"
tab_bar_position = "bottom"
[keys]
split_vertical = "prefix+|"

# Ctrl-h/j/k/l move between panes, passing through to (n)vim when it is in
# front so it can move between its splits first (see navigate.sh).
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "\"$HOME/dotfiles/herdr/navigate.sh\" left"
description = "focus pane left (vim-aware)"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "\"$HOME/dotfiles/herdr/navigate.sh\" down"
description = "focus pane down (vim-aware)"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "\"$HOME/dotfiles/herdr/navigate.sh\" up"
description = "focus pane up (vim-aware)"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "\"$HOME/dotfiles/herdr/navigate.sh\" right"
description = "focus pane right (vim-aware)"

[theme]
name = "nord"
auto_switch = false

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[ui.sidebar]

[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", "tab"], ["agent"]]
