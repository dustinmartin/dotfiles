# Minimal Starship prompt tuned for large repos.
# Keep high-signal context, avoid runtime/version noise, and reduce prompt churn.

format = "$directory$git_branch$git_state$git_status$cmd_duration$line_break$character"
scan_timeout = 30
command_timeout = 500
add_newline = true

[directory]
style = "bold cyan"
truncate_to_repo = true
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = " "
style = "bold purple"
format = " on [$symbol$branch]($style)"
only_attached = true
truncation_length = 32
truncation_symbol = "…"
ignore_branches = ["master", "main"]

[git_state]
style = "yellow"
format = " [$state( $progress_current/$progress_total)]($style)"

[git_status]
style = "red"
format = "([ $all_status$ahead_behind]($style))"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
conflicted = "=${count}"

[cmd_duration]
min_time = 5000
show_milliseconds = false
style = "dimmed yellow"
format = " [took $duration]($style)"
show_notifications = false
min_time_to_notify = 45000

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

