# ------------------------------------------------
# Config
# ------------------------------------------------

# Terminal and color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',*:Tc'

# Enable focus events
set -g focus-events on

# Fix the cursor shape with Neovim
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Set the delay between prefix and command
set -sg escape-time 0

# Set the base index for windows and panes to 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Don't allow programs to rename windows
setw -g allow-rename off
setw -g automatic-rename off

# Increase history limit
set -g history-limit 50000

# Renumber when window is closed
set -g renumber-windows on

# Mouse support
set -g mouse on

# Reload the file with Prefix r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Smart pane switching with awareness of vim splits
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
bind -n 'C-h' if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n 'C-j' if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n 'C-k' if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n 'C-l' if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n 'C-\' if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ------------------------------------------------
# Status Line
# ------------------------------------------------

set -g status-left-length 32
set -g status-right-length 150
set -g status-style fg=colour252,bg=colour236

set -g window-status-activity-style bold
set -g pane-border-style fg=colour245
set -g message-style bold

set -g status-left '#[fg=colour236,bg=colour252,bold] ❐ #S '
set -g window-status-format "#[fg=colour252,bg=colour236,bold] #I) #W "
set -g window-status-current-format "#[fg=colour236,bg=colour39,bold] #I) #W "
set -g status-right ''

# Pane borders
# set -g pane-border-status top
# set -g pane-border-format "#{?pane_active,●,○} #P #{pane_current_command}"

# ------------------------------------------------
# Key Bindings
# ------------------------------------------------

# Splitting panes
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows in the same dir
unbind c
bind c new-window -c "#{pane_current_path}"
bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

# Kill current session
bind X confirm-before kill-session

# Enable vi keys for copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle

# Cross-platform copy support (macOS and Linux)
if-shell "uname | grep -q Darwin" {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
}

# Clear screen history
bind-key k send-keys -R \; clear-history

# Move windows with Shift+arrow (keep focus on moved window)
bind-key -n S-Left swap-window -d -t -1
bind-key -n S-Right swap-window -d -t +1

# Quick window selection
bind -r 'C-h' select-window -t :-
bind -r 'C-l' select-window -t :+

# Pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# ------------------------------------------------
# Plugins
# ------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'

run '~/.tmux/plugins/tpm/tpm'
